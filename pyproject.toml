[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akdbx-relay"
version = "0.1.0"
description = "Relay that forwards encrypted TLS connections to akdbx brokers without decrypting them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.1,<18",
    "cryptography>=42,<51",
    "acme>=2.10,<6",
    "josepy>=1.14,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
akdbx-relay = "akdbx_relay.app:main"

[tool.setuptools]
packages = ["akdbx_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
